name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/PengSim.slnx

      - name: Build
        run: dotnet build src/PengSim.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/PengSim.slnx --no-build --configuration Release --logger "console;verbosity=normal"
